spring.application.name=api-clientes
server.port=8080
# 0.0.0.0 permite que a API receba conexoes pela interface de rede da VM.
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clientes_db}
spring.datasource.username=${DB_USERNAME:api_user}
spring.datasource.password=${DB_PASSWORD:cliente123}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema deve ser criado pelo script em database/schema.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG